name: Optimiser les photos

on:
  push:
    branches: [main]
    paths: ["public/projets/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/photos.mjs
      - name: Enregistrer les photos optimisées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A public/projets
          if ! git diff --cached --quiet; then
            git commit -m "Photos optimisées"
            git pull --rebase
            git push
          fi
